<!DOCTYPE html>
<html>
<head>
  <title>Update Car Availability</title>
</head>
<body>
  <h2>Update Car Availability (Vulnerable Form)</h2>
  <form method="POST" action="/update-car">
    <label for="car_id">Car ID:</label><br>
    <input type="text" name="car_id" id="car_id"><br><br>

    <label for="availability">New Availability:</label><br>
    <input type="text" name="availability" id="availability" placeholder="Available or Unavailable"><br><br>

    <input type="submit" value="Update">
  </form>
</body>
</html>
